[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-review-pulsator"
version = "0.1.0"
description = "Weekly ChatGPT Play Store review pulse (skeleton)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "pydantic>=2.0",
  "typer>=0.12.0",
  "pyyaml>=6.0",
  "google-play-scraper>=1.2.7,<2",
  "langdetect>=1.0.9",
  "python-dotenv>=1.0.0",
  "langchain-groq>=0.2.0",
  "langchain-google-genai>=2.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pulsator = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
